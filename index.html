<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ice Miner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #87CEEB;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
            font-family: 'Nunito', sans-serif;
        }

        img { -webkit-user-drag: none; user-select: none; }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('assets/fon.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ---------------- ЭКРАН ЗАГРУЗКИ ---------------- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            overflow: hidden;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .loading-ui {
            width: 100%;
            padding: 20px 20px 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            z-index: 1;
        }

        #loading-bar-container {
            width: 85vw;
            max-width: 400px;
            height: 32px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 3px solid #93c5fd;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            position: relative;
        }

        #loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #93c5fd);
            transition: width 0.1s linear;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
        }

        #loading-text {
            margin-top: 15px;
            color: #fff;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 2px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
            text-transform: uppercase;
        }

        /* ---------------- ВЕРХНЯЯ ПАНЕЛЬ ---------------- */
        #top-ui {
            position: absolute;
            top: 15px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .profile-box {
            width: 55px;
            height: 55px;
            background: #fff;
            border: 3px solid #4A90E2;
            border-radius: 50%;
            box-shadow: 0 4px 0 #2C5F9E, 0 6px 10px rgba(0,0,0,0.3);
            overflow: hidden;
            flex-shrink: 0;
            background-image: url('assets/profile.png');
            background-size: cover;
            background-position: center;
            pointer-events: auto;
            cursor: pointer;
        }

        .resources {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
        }

        .resource-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #3b82f6;
            border-radius: 12px;
            padding: 3px 10px 3px 4px;
            box-shadow: 0 3px 0 #1e40af, 0 4px 8px rgba(0,0,0,0.25);
            min-width: 80px;
            position: relative;
            backdrop-filter: blur(5px);
            transition: transform 0.1s, background 0.2s;
        }

        .pop {
            transform: scale(1.1);
            background: #ffffff;
        }

        .resource-box.deny {
            animation: denyAnim 0.4s;
        }

        @keyframes denyAnim {
            0%, 100% { background: rgba(255,255,255,0.9); transform: translateX(0); }
            20% { background: #fecaca; transform: translateX(-4px); }
            40% { background: #fecaca; transform: translateX(4px); }
            60% { background: #fecaca; transform: translateX(-3px); }
            80% { background: #fecaca; transform: translateX(3px); }
        }

        .resource-icon {
            width: 24px;
            height: 24px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-right: 6px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
            flex-shrink: 0;
        }

        .icon-ice { background-image: url('assets/ice.png'); }

        .icon-dollar {
            background: #4caf50;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #2e7d32;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }
        .icon-dollar::after {
            content: '$';
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            text-shadow: 1px 1px 0 #1b5e20;
        }

        .resource-value {
            font-weight: 900;
            font-size: 14px;
            color: #1e3a8a;
            text-shadow: 0 1px 0 #fff;
        }

        /* ---------------- НИЖНЕЕ МЕНЮ ---------------- */
        #bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: linear-gradient(to top, #1e3a8a, #3b82f6);
            border-top: 3px solid #93c5fd;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #bfdbfe;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            flex: 1;
            height: 100%;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.2s;
            cursor: pointer;
        }

        .nav-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 2px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
            transition: transform 0.2s;
        }

        .nav-btn.active {
            opacity: 1;
            color: #ffffff;
            background: linear-gradient(to top, rgba(255,255,255,0.1), transparent);
            border-top: 3px solid #fbbf24;
            position: relative;
        }
        .nav-btn.active::before {
            content: '';
            position: absolute;
            top: -3px;
            width: 30px;
            height: 3px;
            background: #fbbf24;
            box-shadow: 0 0 10px #fbbf24;
        }

        .nav-btn.active .nav-icon {
            transform: scale(1.1) translateY(-2px);
            filter: drop-shadow(0 0 8px #fbbf24);
        }

        .nav-btn:active .nav-icon {
            transform: scale(0.9);
        }

        /* ---------------- ЭКРАНЫ ---------------- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .screen.hidden { display: none; }

        /* ---------------- ЭКРАН «ЛЕДНИК» ---------------- */
        #floor {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 110%;
            max-width: 800px;
            pointer-events: none;
            z-index: 10;
        }

        #miner-wrapper {
            position: absolute;
            bottom: calc(18vh + 75px);
            left: 50%;
            transform: translateX(-50%);
            width: 75vw;
            max-width: 400px;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #progress-container {
            width: 70%;
            height: 20px;
            background-color: rgba(0, 0, 0, 0.4);
            border: 2px solid #fff;
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #ffeb3b, #f44336);
            background-size: 280px 100%;
            background-position: left;
        }

        #miner {
            width: 100%;
            height: auto;
            transition: transform 0.05s;
            transform-origin: center bottom;
        }

        .shake { animation: shakeAnim 0.08s infinite; }

        @keyframes shakeAnim {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-2px, -1px) rotate(-1.5deg); }
            50% { transform: translate(-1px, 2px) rotate(1.5deg); }
            75% { transform: translate(2px, -1px) rotate(0deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }

        #particles-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .ice-particle {
            position: absolute;
            width: 35px;
            height: 35px;
            background-image: url('assets/ice.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.6));
            mix-blend-mode: normal;
        }

        #stars-container {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 30;
        }

        .orbit {
            width: 100%;
            height: 100%;
            position: absolute;
            animation: spin 1.5s linear infinite;
        }

        .star {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 23px;
            text-shadow: 0 0 5px #fff, 0 0 10px #FFD700, 0 0 20px #FFA500;
            animation: pulse 0.4s infinite alternate;
        }

        .orbit:nth-child(2) {
            animation-duration: 2s;
            animation-direction: reverse;
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
        }
        .orbit:nth-child(2) .star {
            font-size: 16px;
            text-shadow: 0 0 5px #fff, 0 0 15px #00FFFF;
        }

        .orbit:nth-child(3) {
            animation-duration: 1.2s;
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
        }
        .orbit:nth-child(3) .star {
            font-size: 13px;
            text-shadow: 0 0 5px #fff, 0 0 15px #fff;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(0.9); }
            100% { transform: translateX(-50%) scale(1.2); }
        }

        /* ---------------- ЭКРАН «ДОБЫЧА» ---------------- */
        #screen-mining {
            background: #274b73; /* однотонный фон */
            z-index: 50;
            touch-action: none;
        }

        /* Область под карту: между верхней панелью и нижним меню, с отступами от краёв */
        #map-area {
            position: absolute;
            top: 124px;
            bottom: 83px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --u = 1% ширины карты (задаётся из JS), все размеры внутри карты считаются от неё */
        #map {
            position: relative;
            flex-shrink: 0;
            --u: 4px;
        }

        #map-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        /* Пушки и замки */
        .slot {
            position: absolute;
            width: 0;
            height: 0;
        }

        .cannon {
            position: absolute;
            left: 0;
            top: 0;
            width: calc(var(--u) * 16);
            transform: translate(-50%, -56%);
            pointer-events: none;
            display: none;
        }
        .cannon.flip { transform: translate(-50%, -56%) scaleX(-1); }
        .cannon img { width: 100%; display: block; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.35)); }
        .slot.unlocked .cannon { display: block; }
        .cannon.idle img { filter: drop-shadow(0 4px 4px rgba(0,0,0,0.35)) grayscale(0.5) brightness(0.85); }

        .lock-box {
            position: absolute;
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: calc(var(--u) * 0.6);
            cursor: pointer;
            z-index: 5;
            padding: calc(var(--u) * 1);
        }
        .slot.unlocked .lock-box { display: none; }

        .lock-icon {
            width: calc(var(--u) * 6);
            height: calc(var(--u) * 6);
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
        }

        .price {
            background: rgba(0, 0, 0, 0.78);
            color: #86efac;
            border: 2px solid #4caf50;
            border-radius: calc(var(--u) * 1.4);
            font-weight: 900;
            font-size: calc(var(--u) * 2.6);
            line-height: 1.1;
            padding: calc(var(--u) * 0.3) calc(var(--u) * 1);
            white-space: nowrap;
            text-shadow: 0 1px 0 #000;
        }
        .price.poor { color: #fca5a5; border-color: #ef4444; }

        .lock-box.deny { animation: lockDeny 0.4s; }
        @keyframes lockDeny {
            0%, 100% { transform: translate(-50%, -50%); }
            20% { transform: translate(calc(-50% - 5px), -50%); }
            40% { transform: translate(calc(-50% + 5px), -50%); }
            60% { transform: translate(calc(-50% - 4px), -50%); }
            80% { transform: translate(calc(-50% + 4px), -50%); }
        }

        /* Прораб */
        #foreman {
            position: absolute;
            left: 81%;
            top: 88%;
            width: calc(var(--u) * 25);
            transform: translate(-50%, -100%);
            pointer-events: none;
        }
        #foreman-img {
            width: 100%;
            display: block;
            transform-origin: center bottom;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.35));
        }
        #foreman.locked #foreman-img { filter: brightness(0.22) contrast(0.9); }
        #foreman.working #foreman-img { animation: foremanBob 0.5s ease-in-out infinite alternate; }
        @keyframes foremanBob {
            from { transform: scale(1, 1); }
            to { transform: scale(1.02, 0.98); }
        }

        #foreman-lock {
            position: absolute;
            left: 81%;
            top: 78%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: calc(var(--u) * 0.6);
            cursor: pointer;
            z-index: 6;
            padding: calc(var(--u) * 1);
        }
        #foreman-lock.show { display: flex; }
        #foreman-lock .lock-icon { width: calc(var(--u) * 8); height: calc(var(--u) * 8); }
        #foreman-lock .price { font-size: calc(var(--u) * 3); }
        #foreman-lock.deny { animation: lockDeny 0.4s; }

        /* Счётчик «льда в час» от прораба */
        #foreman-rate {
            position: absolute;
            left: 81%;
            top: 89%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid #3b82f6;
            border-radius: calc(var(--u) * 1.6);
            padding: calc(var(--u) * 0.3) calc(var(--u) * 1.2) calc(var(--u) * 0.3) calc(var(--u) * 0.6);
            box-shadow: 0 3px 0 #1e40af;
            white-space: nowrap;
            z-index: 6;
            pointer-events: none;
        }
        #foreman-rate.show { display: flex; }
        #foreman-rate .ico {
            width: calc(var(--u) * 3.2);
            height: calc(var(--u) * 3.2);
            background: url('assets/ice.png') center/contain no-repeat;
            margin-right: calc(var(--u) * 0.6);
        }
        #foreman-rate .txt {
            font-weight: 900;
            font-size: calc(var(--u) * 2.5);
            color: #1e3a8a;
        }

        /* Кучи снега */
        #piles-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
        }

        .pile {
            position: absolute;
            width: calc(var(--u) * 9.5);
            transform: translate(-50%, -50%);
            pointer-events: none;   /* пока куча растёт, её нельзя взять */
            touch-action: none;
            padding: calc(var(--u) * 0.6);
        }
        .pile.ready { pointer-events: auto; cursor: pointer; }
        .pile-body { transform-origin: 50% 90%; will-change: transform, opacity; }
        .pile img {
            width: 100%;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.3));
        }
        .pile.active img { transform: scale(0.96); }


        .pile-bar {
            position: absolute;
            left: 12%;
            width: 76%;
            top: calc(var(--u) * -1.6);
            height: calc(var(--u) * 1.4);
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #fff;
            border-radius: calc(var(--u) * 1);
            overflow: hidden;
            display: none;
            pointer-events: none;
        }
        .pile.active .pile-bar { display: block; }
        .pile-bar > div {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #ffeb3b);
        }

        /* Слой частиц снега (струя из пушек) */
        #fx {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 8;
        }

        /* ---------- Хаб «Добыча»: список ферм ---------- */
        .mine-view {
            position: absolute;
            top: 78px;
            bottom: 83px;
            left: 0;
            right: 0;
            max-width: 560px;
            margin: 0 auto;
            padding: 4px 12px 0;
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.2vh, 12px);
        }
        .mine-view.hidden, #mine-farm.hidden { display: none; }
        #mine-farm { position: absolute; inset: 0; }

        .hub-card {
            flex: none;
            background: rgba(255,255,255,0.93);
            border: 3px solid #3b82f6;
            border-radius: 18px;
            box-shadow: 0 4px 0 #1e40af, 0 6px 14px rgba(0,0,0,0.3);
            padding: clamp(8px, 1.5vh, 14px);
            color: #1e3a8a;
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.2vh, 10px);
        }
        .hub-top { display: flex; align-items: center; gap: 10px; }
        .hub-top .b-ico { width: clamp(30px, 5vh, 44px); height: clamp(30px, 5vh, 44px); }
        .hub-rate { font-weight: 900; font-size: clamp(22px, 4.4vh, 34px); line-height: 1; white-space: nowrap; }
        .hub-rate small { font-size: 0.5em; opacity: 0.7; }
        .hub-label { font-weight: 800; font-size: clamp(11px, 1.8vh, 14px); color: #16a34a; margin-top: 2px; }
        #hub-build {
            font-family: inherit; font-weight: 900; border: none; cursor: pointer; border-radius: 12px;
            padding: clamp(8px, 1.6vh, 13px) 0; font-size: clamp(15px, 2.6vh, 19px);
            text-transform: uppercase; letter-spacing: 1px; color: #fff;
            background: linear-gradient(to bottom, #60a5fa, #2563eb); box-shadow: 0 4px 0 #1e40af;
            text-shadow: 0 2px 0 rgba(0,0,0,0.25);
        }
        #hub-build:active { transform: translateY(3px); box-shadow: 0 1px 0 #1e40af; }
        #hub-build.disabled { background: linear-gradient(to bottom, #9ca3af, #6b7280); box-shadow: 0 4px 0 #4b5563; }
        .hub-title {
            flex: none; display: flex; justify-content: space-between; align-items: baseline;
            color: #fff; font-weight: 900; font-size: clamp(15px, 2.6vh, 20px);
            padding: 0 4px; text-shadow: 0 2px 0 rgba(0,0,0,0.3);
        }
        #hub-count { opacity: 0.75; font-size: 0.85em; }
        #hub-list {
            flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;
            gap: clamp(5px, 1vh, 10px); padding-bottom: 6px;
        }

        .slot-card {
            flex: 1 1 0; min-height: 0; max-height: 92px;
            display: flex; align-items: center; gap: clamp(8px, 1.6vh, 12px);
            padding: 0 clamp(8px, 1.6vh, 14px);
            background: rgba(255,255,255,0.93);
            border: 2px solid #3b82f6; border-radius: 16px; box-shadow: 0 3px 0 #1e40af;
            color: #1e3a8a; cursor: pointer; overflow: hidden;
        }
        .slot-card:active { transform: translateY(2px); box-shadow: 0 1px 0 #1e40af; }
        .slot-ico {
            flex: none; width: clamp(30px, 5.2vh, 46px); height: clamp(30px, 5.2vh, 46px);
            border-radius: 50%; border: 2px solid #3b82f6;
            background: #dbeafe url('assets/ice.png') center/60% no-repeat;
            display: flex; align-items: center; justify-content: center;
        }
        .slot-main { flex: 1; min-width: 0; }
        .slot-name { font-weight: 900; font-size: clamp(13px, 2.3vh, 17px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
        .slot-sub { font-weight: 800; font-size: clamp(10px, 1.7vh, 13px); opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
        .slot-right { flex: none; }
        .slot-rate { font-weight: 900; font-size: clamp(13px, 2.3vh, 17px); white-space: nowrap; color: #16a34a; }
        .slot-rate.dim { color: #6b7280; font-size: clamp(11px, 1.9vh, 14px); }
        .slot-arrow { flex: none; font-weight: 900; font-size: clamp(22px, 4vh, 30px); color: #3b82f6; line-height: 1; }

    <script>
        // ==========================================
        // 1. ЛОГИКА ЗАГРУЗКИ (МИНИМУМ 2 СЕКУНДЫ)
        // ==========================================
        const assetsToLoad = [
            'assets/fon.png', 'assets/pol.png', 'assets/minerOFF.png',
            'assets/minerON.png', 'assets/ice.png', 'assets/profile.png', 'assets/loading.png',
            'assets/pole.png', 'assets/pushka.png', 'assets/prorab.png', 'assets/snow.png'
        ];

        let loadedCount = 0;
        const totalAssets = assetsToLoad.length;
        const loadingBar = document.getElementById('loading-bar');
        const loadingText = document.getElementById('loading-text');
        const loadingScreen = document.getElementById('loading-screen');

        const MIN_LOADING_TIME = 2000;
        const startTime = Date.now();
        let allAssetsReady = false;

        function checkLoadingStatus() {
            const elapsedTime = Date.now() - startTime;

            if (allAssetsReady && elapsedTime >= MIN_LOADING_TIME) {
                loadingBar.style.width = '100%';
                loadingText.innerText = '100%';

                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    lastFrameTime = 0;
                    requestAnimationFrame(gameLoop);
                }, 300);
            } else {
                if (allAssetsReady) {
                    loadingBar.style.width = '99%';
                    loadingText.innerText = '99%';
                }
            }
        }

        function assetLoaded() {
            loadedCount++;
            const percent = Math.floor((loadedCount / totalAssets) * 100);

            if (!allAssetsReady) {
                loadingBar.style.width = percent + '%';
                loadingText.innerText = percent + '%';
            }

        // ==========================================

        const SAVE_KEY = 'iceMiner_v1';

        const PRICE_MIN = 0.1;        // курс 1 льда колеблется от 0.1 $
        const PRICE_MAX = 0.3;        // до 0.3 $
        const BOURSE_WINDOW = 3 * 3600 * 1000; // окно графика — 3 часа

        const CANNON_PRICES = [1000, 7000, 25000, 70000];
        const FOREMAN_PRICE = 5000;
        const SLOT_BASE = 3;                              // слотов под фермы по умолчанию
        const SLOT_MAX = 5;                               // максимум слотов
        const SLOT_PRICES = { 4: 300000, 5: 7000000 };    // цена открытия 4-го и 5-го слота
        const PILES_PER_MIN_PER_CANNON = 5;
        const CANNON_INTERVAL = 60000 / PILES_PER_MIN_PER_CANNON; // 12 сек

        const fmt = n => String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

        // Полёт льда (частицы) к счётчику льда
        function flyIce(startX, startY, onDone, spread) {
            const ice = document.createElement('div');
            ice.classList.add('ice-particle');

            const containerRect = gameContainer.getBoundingClientRect();
            const targetRect = uiIceBox.getBoundingClientRect();

            ice.style.top = startY + 'px';
            particlesLayer.appendChild(ice);

            const sp = spread || 100;
            const midX = startX + (Math.random() - 0.5) * sp;
            const midY = startY - (50 + Math.random() * sp);

            const animation = ice.animate([
                { transform: 'translate(-50%, -50%) scale(0.8) rotate(0deg)', opacity: 1 },
                { transform: `translate(calc(-50% + ${midX - startX}px), calc(-50% + ${midY - startY}px)) scale(1) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: 0.4 },
                { transform: `translate(calc(-50% + ${endX - startX}px), calc(-50% + ${endY - startY}px)) scale(0.2) rotate(${Math.random() * 720}deg)`, opacity: 0.5 }
            ], {
                duration: 400,
                easing: 'cubic-bezier(0.25, 1, 0.5, 1)',

            });

            animation.onfinish = () => {
                ice.remove();

        // ==========================================
        // 3. ВКЛАДКИ
        // ==========================================
        const screens = {

        function setTab(name) {

        // ==========================================
        // 4. ЭКРАН «ЛЕДНИК» (ручная добыча)
        // ==========================================
        const miner = document.getElementById('miner');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const starsContainer = document.getElementById('stars-container');

        let isMining = false;
        let isOverheated = false;

        let progress = 0;
        let lastFrameTime = 0;
        let accumulatedProgress = 0;

        function getSpawnRate(progressPercent) {
            if (progressPercent < 20) return 2;
            if (progressPercent < 40) return 4;
            if (progressPercent < 60) return 6;
            if (progressPercent < 80) return 12;
            return 24;
        }

        function spawnIce() {
            const minerRect = miner.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();
            const startX = (minerRect.left - containerRect.left) + (minerRect.width / 2);
            const startY = (minerRect.top - containerRect.top) + minerRect.height * 0.85;
            flyIce(startX, startY, () => addIce(1), 100);
        }

        function gameLoop(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const deltaTime = timestamp - lastFrameTime;
            lastFrameTime = timestamp;

            if (isMining && !isOverheated) {
                progress += deltaTime * 0.02;
                if (progress > 100) progress = 100;
                progressBar.style.width = progress + '%';

                const currentRate = getSpawnRate(progress);
                const ratePerMs = currentRate / 1000;

                accumulatedProgress += deltaTime * ratePerMs;

                while (accumulatedProgress >= 1) {
                    spawnIce();
                    accumulatedProgress -= 1;
                }

                if (progress >= 100) {
                    triggerOverheat();
                }

            } else if (!isMining && !isOverheated) {
                if (progress > 0) {
                    progress -= deltaTime * 0.05;
                    if (progress < 0) progress = 0;
                    progressBar.style.width = progress + '%';
                    if (progress === 0) progressContainer.style.opacity = 0;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function startMining(e) {
            if (e.cancelable) e.preventDefault();
            if (currentTab !== 'glacier') return;
            if (isOverheated || isMining) return;

            isMining = true;
            miner.src = 'assets/minerON.png';
            miner.classList.add('shake');
            progressContainer.style.opacity = 1;
            lastFrameTime = 0;
        }

        function stopMining(e) {
            if (e && e.cancelable) e.preventDefault();
            if (isOverheated || !isMining) return;

            isMining = false;
            miner.src = 'assets/minerOFF.png';
            miner.classList.remove('shake');
        }

        function triggerOverheat() {
            isOverheated = true;

            miner.src = 'assets/minerOFF.png';

            let cooldownTimer = setInterval(() => {
                progress -= 2;

                    clearInterval(cooldownTimer);

                    starsContainer.style.display = 'none';
                    progressContainer.style.opacity = 0;
                    progressBar.style.width = '0%';
                }
                progressBar.style.width = progress + '%';
            }, 50);
        }

        // Ручная добыча — только на экране «Ледник»

        glacierScreen.addEventListener('mouseup', stopMining);
