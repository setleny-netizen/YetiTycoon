<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ice Miner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #87CEEB;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Nunito', sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('assets/fon.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ---------------- ЭКРАН ЗАГРУЗКИ ---------------- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0f172a; /* Темный фон на случай, если картинка не покроет края */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Прижимаем контент к низу */
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
            overflow: hidden;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Картинка на весь экран */
        #loading-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Заполняет весь экран, обрезая лишнее */
            z-index: -1; /* Уходит под прогресс-бар */
            /* Легкая пульсация для живости */
            animation: bgPulse 3s infinite alternate;
        }

        @keyframes bgPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Контейнер для прогресс-бара внизу */
        .loading-ui {
            width: 100%;
            padding: 20px 20px 40px 20px; /* Отступы по бокам и снизу */
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); /* Затемнение внизу для читаемости */
            z-index: 1;
        }

        /* Прогресс-бар загрузки */
        #loading-bar-container {
            width: 80vw;
            max-width: 400px;
            height: 16px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid #93c5fd;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
        }

        #loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #93c5fd);
            transition: width 0.1s linear;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
        }

        #loading-text {
            margin-top: 12px;
            color: #fff;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            text-transform: uppercase;
        }

        /* ---------------- ВЕРХНЯЯ ПАНЕЛЬ ---------------- */
        #top-ui {
            position: absolute;
            top: 15px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        /* Профиль КРУГЛЫЙ */
        .profile-box {
            width: 55px;
            height: 55px;
            background: #fff;
            border: 3px solid #4A90E2;
            border-radius: 50%;
            box-shadow: 0 4px 0 #2C5F9E, 0 6px 10px rgba(0,0,0,0.3);
            overflow: hidden;
            flex-shrink: 0;
            background-image: url('assets/profile.png');
            background-size: cover;
            background-position: center;
        }

        .resources {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
        }

        .resource-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #3b82f6;
            border-radius: 12px;
            padding: 3px 10px 3px 4px;
            box-shadow: 0 3px 0 #1e40af, 0 4px 8px rgba(0,0,0,0.25);
            min-width: 80px;
            position: relative;
            backdrop-filter: blur(5px);
            transition: transform 0.1s, background 0.2s;
        }

        .pop {
            transform: scale(1.1);
            background: #ffffff;
        }

        .resource-icon {
            width: 24px;
            height: 24px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-right: 6px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        .icon-ice { background-image: url('assets/ice.png'); }

        .icon-dollar {
            background: #4caf50;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #2e7d32;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }
        .icon-dollar::after {
            content: '$';
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            text-shadow: 1px 1px 0 #1b5e20;
        }

        .resource-value {
            font-weight: 900;
            font-size: 14px;
            color: #1e3a8a;
            text-shadow: 0 1px 0 #fff;
        }

        /* ---------------- НИЖНЕЕ МЕНЮ ---------------- */
        #bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: linear-gradient(to top, #1e3a8a, #3b82f6);
            border-top: 3px solid #93c5fd;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #bfdbfe;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            flex: 1;
            height: 100%;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.2s;
            cursor: pointer;
        }

        .nav-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 2px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
            transition: transform 0.2s;
        }

        .nav-btn.active {
            opacity: 1;
            color: #ffffff;
            background: linear-gradient(to top, rgba(255,255,255,0.1), transparent);
            border-top: 3px solid #fbbf24;
            position: relative;
        }
        .nav-btn.active::before {
            content: '';
            position: absolute;
            top: -3px;
            width: 30px;
            height: 3px;
            background: #fbbf24;
            box-shadow: 0 0 10px #fbbf24;
        }
        
        .nav-btn.active .nav-icon {
            transform: scale(1.1) translateY(-2px);
            filter: drop-shadow(0 0 8px #fbbf24);
        }

        .nav-btn:active .nav-icon {
            transform: scale(0.9);
        }

        /* ---------------- ИГРОВЫЕ ЭЛЕМЕНТЫ ---------------- */
        
        #floor {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 110%;
            max-width: 800px;
            pointer-events: none;
            z-index: 10;
        }

        #miner-wrapper {
            position: absolute;
            bottom: calc(18vh + 75px);
            left: 50%;
            transform: translateX(-50%);
            width: 75vw; 
            max-width: 400px; 
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #progress-container {
            width: 70%;
            height: 20px;
            background-color: rgba(0, 0, 0, 0.4);
            border: 2px solid #fff;
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #ffeb3b, #f44336);
            background-size: 280px 100%;
            background-position: left;
        }

        #miner {
            width: 100%;
            height: auto;
            transition: transform 0.05s;
            transform-origin: center bottom;
        }

        .shake { animation: shakeAnim 0.08s infinite; }

        @keyframes shakeAnim {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-2px, -1px) rotate(-1.5deg); }
            50% { transform: translate(-1px, 2px) rotate(1.5deg); }
            75% { transform: translate(2px, -1px) rotate(0deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }

        #particles-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999; 
            overflow: hidden;
        }

        .ice-particle {
            position: absolute;
            width: 35px; 
            height: 35px; 
            background-image: url('assets/ice.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.6)); 
            mix-blend-mode: normal;
        }

        /* Звездочки */
        #stars-container {
            position: absolute;
            top: -50px; 
            left: 50%;
            transform: translateX(-50%);
            width: 100px; 
            height: 100px;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 30;
        }

        .orbit {
            width: 100%;
            height: 100%;
            position: absolute;
            animation: spin 1.5s linear infinite;
        }

        .star {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 23px; 
            text-shadow: 0 0 5px #fff, 0 0 10px #FFD700, 0 0 20px #FFA500;
            animation: pulse 0.4s infinite alternate;
        }

        .orbit:nth-child(2) {
            animation-duration: 2s;
            animation-direction: reverse;
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
        }
        .orbit:nth-child(2) .star {
            font-size: 16px; 
            text-shadow: 0 0 5px #fff, 0 0 15px #00FFFF;
        }

        .orbit:nth-child(3) {
            animation-duration: 1.2s;
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
        }
        .orbit:nth-child(3) .star {
            font-size: 13px; 
            text-shadow: 0 0 5px #fff, 0 0 15px #fff;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(0.9); }
            100% { transform: translateX(-50%) scale(1.2); }
        }

    </style>
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ (КАРТИНКА НА ВЕСЬ ЭКРАН) -->
    <div id="loading-screen">
        <img id="loading-img" src="assets/loading.png" alt="Loading...">
        
        <div class="loading-ui">
            <div id="loading-bar-container">
                <div id="loading-bar"></div>
            </div>
            <div id="loading-text">0%</div>
        </div>
    </div>

    <div id="game-container">
        
        <div id="top-ui">
            <div class="profile-box"></div>
            <div class="resources">
                <div class="resource-box" id="ui-ice-box">
                    <div class="resource-icon icon-ice"></div>
                    <div class="resource-value" id="ice-count">0</div>
                </div>
                <div class="resource-box" id="ui-dollar-box">
                    <div class="resource-icon icon-dollar"></div>
                    <div class="resource-value" id="dollar-count">0</div>
                </div>
            </div>
        </div>

        <img id="floor" src="assets/pol.png" alt="floor">
        
        <div id="miner-wrapper">
            <div id="stars-container">
                <div class="orbit"><div class="star">⭐</div></div>
                <div class="orbit"><div class="star">⭐</div></div>
                <div class="orbit"><div class="star">⭐</div></div>
            </div>

            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>

            <img id="miner" src="assets/minerOFF.png" alt="miner">
        </div>
        
        <div id="particles-layer"></div>

        <div id="bottom-nav">
            <div class="nav-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 16L10 10L14 14L20 6" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20 6H15" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20 6V11" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Биржа</span>
            </div>
            <div class="nav-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 4L20 10L17 13L11 7L14 4Z" fill="#FFF"/>
                    <path d="M11.5 7.5L4 15C3 16 3 17.5 4 18.5C5 19.5 6.5 19.5 7.5 18.5L15 11" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 20L2 22" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <span>Добыча</span>
            </div>
            <div class="nav-btn active">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" fill="#93C5FD" stroke="#FFF" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M12 22V12M3 7L12 12L21 7" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Ледник</span>
            </div>
            <div class="nav-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="8" fill="#FFF"/>
                    <circle cx="7" cy="7" r="3" fill="#FFF"/>
                    <circle cx="17" cy="7" r="3" fill="#FFF"/>
                    <circle cx="9" cy="11" r="1.5" fill="#1e3a8a"/>
                    <circle cx="15" cy="11" r="1.5" fill="#1e3a8a"/>
                    <path d="M10 15C10 15 11 17 12 17C13 17 14 15 14 15" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span>Берлога</span>
            </div>
            <div class="nav-btn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 3H5L7 15H19L21 7H6" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="7" cy="19" r="2" fill="#FFF"/>
                    <circle cx="17" cy="19" r="2" fill="#FFF"/>
                </svg>
                <span>Магазин</span>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. ЛОГИКА ЗАГРУЗКИ РЕСУРСОВ (PRELOADER)
        // ==========================================
        const assetsToLoad = [
            'assets/fon.png',
            'assets/pol.png',
            'assets/minerOFF.png',
            'assets/minerON.png',
            'assets/ice.png',
            'assets/profile.png',
            'assets/loading.png'
        ];

        let loadedCount = 0;
        const totalAssets = assetsToLoad.length;
        const loadingBar = document.getElementById('loading-bar');
        const loadingText = document.getElementById('loading-text');
        const loadingScreen = document.getElementById('loading-screen');

        function assetLoaded() {
            loadedCount++;
            const percent = Math.floor((loadedCount / totalAssets) * 100);
            loadingBar.style.width = percent + '%';
            loadingText.innerText = percent + '%';

            if (loadedCount === totalAssets) {
                // Все загружено, скрываем экран
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    // Запускаем игру (инициализация таймера)
                    lastFrameTime = 0;
                    requestAnimationFrame(gameLoop);
                }, 500); // Небольшая задержка, чтобы игрок увидел 100%
            }
        }

        // Запускаем предзагрузку
        assetsToLoad.forEach(src => {
            const img = new Image();
            img.onload = assetLoaded;
            img.onerror = assetLoaded; // Даже если ошибка, считаем загруженным, чтобы не зависнуть
            img.src = src;
        });


        // ==========================================
        // 2. ИГРОВАЯ ЛОГИКА
        // ==========================================
        const miner = document.getElementById('miner');
        const gameContainer = document.getElementById('game-container');
        const particlesLayer = document.getElementById('particles-layer');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const starsContainer = document.getElementById('stars-container');
        
        const iceCountEl = document.getElementById('ice-count');
        const dollarCountEl = document.getElementById('dollar-count');
        const uiIceBox = document.getElementById('ui-ice-box');

        let iceCount = 0;
        let dollarCount = 0;

        let isMining = false;
        let isOverheated = false;
        
        let progress = 0; 
        let lastFrameTime = 0;
        let accumulatedProgress = 0; 

        function getSpawnRate(progressPercent) {
            if (progressPercent < 20) return 2;
            if (progressPercent < 40) return 4;
            if (progressPercent < 60) return 6;
            if (progressPercent < 80) return 12;
            return 24;
        }

        function addIce() {
            iceCount++;
            iceCountEl.innerText = iceCount;
            uiIceBox.classList.add('pop');
            setTimeout(() => uiIceBox.classList.remove('pop'), 100);
        }

        function spawnIce() {
            const ice = document.createElement('div');
            ice.classList.add('ice-particle');
            
            const minerRect = miner.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();
            const targetRect = uiIceBox.getBoundingClientRect();

            const startX = (minerRect.left - containerRect.left) + (minerRect.width / 2);
            const startY = (minerRect.top - containerRect.top) + minerRect.height * 0.85; 

            const endX = (targetRect.left - containerRect.left) + (targetRect.width / 2);
            const endY = (targetRect.top - containerRect.top) + (targetRect.height / 2);

            ice.style.left = startX + 'px';
            ice.style.top = startY + 'px';

            particlesLayer.appendChild(ice);

            const midX = startX + (Math.random() - 0.5) * 100;
            const midY = startY - (50 + Math.random() * 100);

            const animation = ice.animate([
                { transform: 'translate(-50%, -50%) scale(0.8) rotate(0deg)', opacity: 1 },
                { transform: `translate(calc(-50% + ${midX - startX}px), calc(-50% + ${midY - startY}px)) scale(1) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: 0.4 },
                { transform: `translate(calc(-50% + ${endX - startX}px), calc(-50% + ${endY - startY}px)) scale(0.2) rotate(${Math.random() * 720}deg)`, opacity: 0.5 }
            ], {
                duration: 400, 
                easing: 'cubic-bezier(0.25, 1, 0.5, 1)', 
                fill: 'forwards'
            });

            animation.onfinish = () => {
                ice.remove();
                addIce(); 
            };
        }

        function gameLoop(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const deltaTime = timestamp - lastFrameTime;
            lastFrameTime = timestamp;

            if (isMining && !isOverheated) {
                progress += deltaTime * 0.02;
                if (progress > 100) progress = 100;
                progressBar.style.width = progress + '%';

                const currentRate = getSpawnRate(progress);
                const ratePerMs = currentRate / 1000;
                
                accumulatedProgress += deltaTime * ratePerMs;
                
                while (accumulatedProgress >= 1) {
                    spawnIce();
                    accumulatedProgress -= 1;
                }

                if (progress >= 100) {
                    triggerOverheat();
                }

            } else if (!isMining && !isOverheated) {
                if (progress > 0) {
                    progress -= deltaTime * 0.05; 
                    if (progress < 0) progress = 0;
                    progressBar.style.width = progress + '%';
                    if (progress === 0) progressContainer.style.opacity = 0;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function startMining(e) {
            if (e.cancelable) e.preventDefault();
            if (isOverheated || isMining) return; 
            
            isMining = true;
            miner.src = 'assets/minerON.png';
            miner.classList.add('shake');
            progressContainer.style.opacity = 1;
            lastFrameTime = 0; 
        }

        function stopMining(e) {
            if (e && e.cancelable) e.preventDefault();
            if (isOverheated || !isMining) return;
            
            isMining = false;
            miner.src = 'assets/minerOFF.png';
            miner.classList.remove('shake');
        }

        function triggerOverheat() {
            isOverheated = true;
            isMining = false;
            
            miner.src = 'assets/minerOFF.png';
            miner.classList.remove('shake');
            starsContainer.style.display = 'flex';

            let cooldownTimer = setInterval(() => {
                progress -= 2;
                if (progress <= 0) {
                    progress = 0;
                    clearInterval(cooldownTimer);
                    isOverheated = false;
                    starsContainer.style.display = 'none';
                    progressContainer.style.opacity = 0; 
                    progressBar.style.width = '0%';
                }
                progressBar.style.width = progress + '%';
            }, 50);
        }

        gameContainer.addEventListener('touchstart', startMining, { passive: false });
        gameContainer.addEventListener('touchend', stopMining);
        gameContainer.addEventListener('touchcancel', stopMining);

        gameContainer.addEventListener('mousedown', startMining);
        gameContainer.addEventListener('mouseup', stopMining);
        gameContainer.addEventListener('mouseleave', stopMining); 
    </script>
</body>
</html>
